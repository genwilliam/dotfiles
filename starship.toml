"$schema" = "https://starship.rs/config-schema.json"

# Inserts a blank line between shell prompts
add_newline = true

command_timeout = 800
scan_timeout = 30

format = """
$directory$git_branch$git_status${custom.python_venv}$golang$nodejs${custom.vue}$fill$cmd_duration$time
$status$character
"""

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "

[fill]
symbol = " "

# ----------------------
# Git
# ----------------------
# Git 分支/状态显示配置
[git_branch]
only_attached = true
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
up_to_date = "✓"
conflicted = "✖"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = "([$state( $progress_current/$progress_total)]($style) )"
style = "bold red"

[git_metrics]
disabled = false
format = "([+$added]($added_style)/[-$deleted]($deleted_style) )"
added_style = "bold green"
deleted_style = "bold red"

# ----------------------
# Directory
# ----------------------
[directory]
truncation_length = 0
truncate_to_repo = false
style = "bold blue"
read_only = " 󰌾"


# ======================
# Python venv（仅在当前目录属于该 venv 项目时显示）
# ======================
[custom.python_venv]
# 逻辑：仅当已激活 venv 且当前目录位于该 venv 的项目根目录下时显示
when = '''
test -n "$VIRTUAL_ENV" || exit 1
PROJECT_ROOT="${VIRTUAL_ENV%/*}"
case "$PWD/" in
    "$PROJECT_ROOT"/*|"$PROJECT_ROOT"/)
        exit 0
        ;;
    *)
        exit 1
        ;;
esac
'''

command = '''
# 在项目内：显示 venv 名和版本
venv=$(basename "$VIRTUAL_ENV")
pyver=$(python --version 2>&1 | sed "s/Python //")
echo "$venv v$pyver"
'''

# 样式
style = "bold green"
format = "via [ $output]($style) "

# 如果你希望“激活失败/路径不符”时颜色变红，可以用下面的高级格式（可选）
# format = "via [ ${output}]($style) "


# ----------------------
# Golang
# ----------------------
[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

# ----------------------
# Duration & Time
# ----------------------
[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold blue"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style) "
style = "bold white"

# ----------------------
# Status
# ----------------------
[status]
disabled = false
symbol = "✖"
success_symbol = ""
map_symbol = false
format = "[$symbol $status]($style) "
style = "bold red"



# ----------------------
# Hostname
# ----------------------
[hostname]
ssh_only = true
ssh_symbol = " "

