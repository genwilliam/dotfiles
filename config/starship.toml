[custom.vue]
when = '''
test -f package.json && grep -q '"vue"' package.json
'''
command = '''
grep -oE '"vue"[[:space:]]*:[[:space:]]*"[^"]+"' package.json | head -1 | sed -E 's/.*"([^"]+)".*/\1/' | sed -E 's/^[^0-9]*//'
'''
style = "bold green"
format = "[ v$output ]($style)"

