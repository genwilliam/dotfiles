"$schema" = "https://starship.rs/config-schema.json"

# Inserts a blank line between shell prompts
add_newline = true

command_timeout = 800
scan_timeout = 30

format = """
$directory$git_branch$git_status$python${custom.python_env_source}${custom.python_unactivated_hint}$golang$nodejs${custom.vue}$fill$cmd_duration$time
$status$character
"""

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vicmd_symbol = "[❮](bold yellow) "

[fill]
symbol = " "

# Git branch/status display configuration
[git_branch]
only_attached = true
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
format = "([$ahead_behind$modified$staged]($style) )"
up_to_date = "✓"
conflicted = ""
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = ""
stashed = ""
modified = "!${count}"
staged = "+${count}"
renamed = ""
deleted = ""

[git_state]
format = "([$state( $progress_current/$progress_total)]($style) )"
style = "bold red"

[git_metrics]
disabled = false
format = "([+$added]($added_style)/[-$deleted]($deleted_style) )"
added_style = "bold green"
deleted_style = "bold red"

# Directory
[directory]
truncation_length = 0
truncate_to_repo = false
style = "bold blue"
read_only = " 󰌾"


# Python (built-in priority)
[python]
symbol = " "
format = "via [$symbol$version]($style) "
detect_env_vars = []
detect_files = ["pyproject.toml", "requirements.txt", "Pipfile", "poetry.lock", ".python-version", "uv.lock", "setup.py"]
detect_extensions = ["py", "ipynb"]

[custom.python_env_source]
when = '''
# Show only when in a Python project and the active venv belongs to another project
(test -f pyproject.toml || test -f requirements.txt || test -f Pipfile || test -f poetry.lock || test -f .python-version || test -f uv.lock) || exit 1
test -n "$VIRTUAL_ENV" || exit 1

PROJECT_ROOT_FROM_VENV="${VIRTUAL_ENV%/*}"
case "$PWD/" in
	"$PROJECT_ROOT_FROM_VENV"/*|"$PROJECT_ROOT_FROM_VENV"/)
		exit 1
		;;
	*)
		exit 0
		;;
esac
'''
command = '''
project_root="${VIRTUAL_ENV%/*}"
project_name="${project_root##*/}"

if test -f "$project_root/uv.lock"; then
	echo "uv:${project_name}"
else
	echo "venv:${project_name}"
fi
'''
style = "dimmed cyan"
format = "[$output]($style) "

[custom.python_unactivated_hint]
when = '''
(test -f pyproject.toml || test -f requirements.txt || test -f Pipfile || test -f poetry.lock || test -f .python-version || test -f uv.lock) || exit 1

# No Python environment is active: treat as not activated
if test -z "$VIRTUAL_ENV" && test -z "$CONDA_PREFIX" && test -z "$PIXI_ENVIRONMENT_NAME"; then
	exit 0
fi

# For venv activation, only treat as activated when it belongs to current project
if test -n "$VIRTUAL_ENV"; then
	PROJECT_ROOT_FROM_VENV="${VIRTUAL_ENV%/*}"
	case "$PWD/" in
		"$PROJECT_ROOT_FROM_VENV"/*|"$PROJECT_ROOT_FROM_VENV"/)
			exit 1
			;;
		*)
			exit 0
			;;
	esac
fi

# conda / pixi activation is treated as activated
exit 1
'''
command = 'echo "Not activated"'
style = "dimmed red"
format = "[$output]($style) "


[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

# Duration & Time
[cmd_duration]
min_time = 1500
format = "took [$duration]($style) "
style = "bold blue"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style) "
style = "bold white"

[custom.time_cond]
when = 'test -n "$SSH_CONNECTION" || test "${STARSHIP_SHOW_TIME:-0}" = "1"'
command = 'date +"%H:%M"'
style = "bold white"
format = "[$output]($style) "

[status]
disabled = false
symbol = "✖"
success_symbol = ""
map_symbol = false
format = "[$symbol $status]($style) "
style = "bold red"

